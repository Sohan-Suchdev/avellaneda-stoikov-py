name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

      # Skip pytest cleanly until the project has a tests/ directory.
      - name: Pytest
        if: ${{ hashFiles('tests/**') != '' }}
        run: pytest

      - name: Skip pytest
        if: ${{ hashFiles('tests/**') == '' }}
        run: echo "No tests/ directory found; skipping pytest."

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
